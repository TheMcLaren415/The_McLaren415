<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The_McLaren875</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --accent: #5865F2; /* Discord Blurple */
            --bg-dark: #0a0b10;
            --glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            height: 100vh;
            background: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== BACKGROUND ANIMATION ===== */
        #bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(45deg, #012a4a, #014f86, #2a9df4);
            z-index: -1;
        }

        .wave {
            position: absolute;
            bottom: 0; width: 200%; height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 40%;
            animation: waveMove 10s infinite linear;
        }
        .wave:nth-child(2) { opacity: 0.3; animation-duration: 15s; bottom: 10px; }

        @keyframes waveMove {
            from { transform: translateX(0) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        /* ===== INTRO ===== */
        #intro {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.8s ease-out;
        }
        #intro.hide { opacity: 0; pointer-events: none; }
        
        #enterBtn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--accent);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #enterBtn:hover { background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* ===== PROFILE CARD ===== */
        .card {
            width: 380px;
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Avatar with Custom Frame */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* Анимированная рамка (аналог той, что на скрине) */
        .frame {
            position: absolute;
            inset: -8px;
            border: 3px solid #ff0000; /* Цвет красный как на скрине */
            border-radius: 50%;
            box-shadow: 0 0 15px #ff0000;
            animation: pulse-frame 2s infinite ease-in-out;
            z-index: 1;
        }
        
        /* Статусная иконка "Не беспокоить" */
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            background: #ed4245;
            border-radius: 50%;
            border: 4px solid #1e1f22;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-dot::after { content: ""; width: 10px; height: 2px; background: white; }

        /* Nickname Styling */
        .nick-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .nick-wrap h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
        .badge { font-size: 0.7rem; background: #444; padding: 2px 6px; border-radius: 4px; vertical-align: middle; }

        .subtitle { color: #b5bac1; font-size: 0.9rem; margin-bottom: 20px; }
        
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 0.85rem; }
        .tag { background: var(--glass); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border-glass); }

        .btn-link {
            display: block;
            margin-top: 25px;
            padding: 12px;
            background: var(--accent);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-link:hover { opacity: 0.8; transform: translateY(-2px); }

        /* View Counter */
        #views {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--glass);
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem;
        }

        @keyframes pulse-frame {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
        }
    </style>
</head>
<body>

<div id="bg">
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<div id="intro">
    <h1 style="margin-bottom: 20px; font-size: 2.5rem;">† The_McLaren</h1>
    <button id="enterBtn">Войти</button>
</div>

<audio id="music" loop>
    <source src="music/po-kajfu.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <div class="avatar-container">
        <div class="frame"></div>
        <img src="Снимок экрана 2026-04-07 194322.png" alt="Avatar" class="profile-img">
        <div class="status-dot"></div>
    </div>

    <div class="nick-wrap">
        <h2>† The_McLaren</h2>
        <span class="badge">875</span>
    </div>
    
    <div class="subtitle">Full-stack Coder | 875 Team Owner</div>

    <div class="tags">
        <span class="tag">Python</span>
        <span class="tag">C++</span>
        <span class="tag">HTML/CSS</span>
        <span class="tag">Luau</span>
        <span class="tag">Java</span>
    </div>

    <p style="margin-top: 15px; font-size: 0.9rem; color: #8899aa;">Работаем Братья 🇷🇺</p>

    <a href="https://discord.gg/8UT5F5MncR" target="_blank" class="btn-link">
        Присоединиться к SQUAD
    </a>
</div>

<div id="views">
    <span id="viewCount">0</span> 👀
</div>

<script>
    const btn = document.getElementById("enterBtn");
    const music = document.getElementById("music");
    const intro = document.getElementById("intro");

    btn.onclick = () => {
        music.volume = 0.2;
        music.play().catch(() => console.log("Музыка заблокирована браузером"));
        intro.classList.add("hide");
        updateViews();
    };

    function updateViews() {
        const key = "mclaren_views";
        const today = new Date().toDateString();
        let count = parseInt(localStorage.getItem(key)) || 0;
        
        if(localStorage.getItem("last_visit") !== today) {
            count++;
            localStorage.setItem(key, count);
            localStorage.setItem("last_visit", today);
        }
        document.getElementById("viewCount").textContent = count;
    }
</script>

</body>
</html>
